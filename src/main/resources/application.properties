spring.application.name=productos-api-springboot

# Mismo puerto y dirección que la API Express: el frontend no cambia.
server.port=${PORT:3000}
server.address=${HOST:0.0.0.0}

# Origen exacto del navegador (protocolo, host y puerto, sin barra final). Varios, separados por comas.
cors.origenes=${CORS_ORIGINS:http://localhost:5173}

# Base de datos H2 guardada en un archivo: no hay que instalar ningún motor.
# Los datos se conservan entre reinicios de un único proceso.
spring.datasource.url=${DATA_URL:jdbc:h2:file:./data/productos}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Jackson estricto: un stock 2.5 o un precio "abc" entre comillas deben dar 400, no convertirse.
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.mapper.allow-coercion-of-scalars=false

logging.level.com.duoc.productos=INFO
